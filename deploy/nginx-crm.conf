# Nginx для CRM: принимает запросы из интернета, проверяет пароль,
# раздаёт сайт и передаёт /api/... внутреннему Node-серверу.
# Устанавливается скриптом deploy/setup.sh в /etc/nginx/sites-available/rental-crm

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Пока без домена — открываем по IP. Позже сюда впишем домен и включим HTTPS.
    server_name _;

    # Пароль на весь сайт (включая /api и страницы импорта)
    auth_basic "CRM Arenda";
    auth_basic_user_file /etc/nginx/.htpasswd-crm;

    # Загрузка шаблонов и документов (base64) — с запасом
    client_max_body_size 30m;

    # Сжатие: ответы с данными уходят быстрее
    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    root /opt/rental-crm/build;
    index index.html;

    # Серверные функции
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Файлы сборки с хэшем в имени — можно кэшировать надолго
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем, чтобы после обновления сразу подхватывалась новая версия
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Всё остальное — приложение React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
