btn.disabled=true;btn.textContent='Импорт...';log.innerHTML='';
let ok=0,err=0;
for(let i=0;i<contacts.length;i++){
const c=contacts[i];
try{
const res=await fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({query:'INSERT INTO contacts(id,tenant_id,full_name,position,phone,is_primary,description) VALUES($1,$2,$3,$4,$5,$6,$7) ON CONFLICT(id) DO NOTHING',params:[c[0],c[1],c[2],c[3],c[4],false,null]})});
const d=await res.json();
if(d.error){log.innerHTML+=`<div class="err">[${i+1}] ❌ ${c[2]}: ${d.error}</div>`;err++;}
else{log.innerHTML+=`<div class="ok">[${i+1}] ✅ ${c[2]}</div>`;ok++;}
}catch(e){log.innerHTML+=`<div class="err">[${i+1}] ❌ ${c[2]}: ${e.message}</div>`;err++;}
log.scrollTop=log.scrollHeight;
}
log.innerHTML+=`<div style="margin-top:12px;font-weight:bold">Готово: ✅ ${ok} успешно, ❌ ${err} ошибок</div>`;
btn.textContent='Импорт завершён';
}
</script>
</body>
</html>
