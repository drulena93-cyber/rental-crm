async function startImport() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  log('🚀 Начинаем импорт ' + tenants.length + ' арендаторов...');
  let ok = 0, err = 0;
  for (const t of tenants) {
    try {
      const r = await fetch('/api/db', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          query: `INSERT INTO tenants(id,name,type,status,activity,passport,comments,object_id)VALUES($1,$2,$3,$4,$5,$6,$7,$8)ON CONFLICT(id)DO NOTHING`,
          params: [t.id,t.name,t.type,t.status,t.activity,t.passport,t.comments,t.object_id]
        })
      });
      const d = await r.json();
      if (d.error) { log('❌ ' + t.name + ': ' + d.error); err++; }
      else ok++;
    } catch(e) { log('❌ ' + t.name + ': ' + e.message); err++; }
  }
  log('✅ Готово! Загружено: ' + ok + ', ошибок: ' + err);
  btn.disabled = false;
}
